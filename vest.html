<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAIR Signposting Metadata Harvester</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 30px; max-width: 900px; line-height: 1.5; color: #333; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #2da44e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c974b; }
        pre { background: #f6f8fa; padding: 15px; border: 1px solid #d0d7de; border-radius: 6px; overflow-x: auto; font-family: monospace; }
        .section-title { font-weight: bold; margin-top: 20px; color: #0969da; }
        .error { color: #cf222e; font-weight: bold; }
    </style>
</head>
<body>

    <h1>FAIR Signposting Metadata Høster</h1>
    <p>Skriv inn nettadressen til siden du vil høste metadata fra (f.eks. din egen signposting-side):</p>
    
    <div style="margin-bottom: 20px;">
        <input type="text" id="targetUrl" value="https://github.io">
        <button id="harvestBtn">Høst metadata</button>
    </div>

    <div id="status"></div>

    <div class="section-title">1. Metadata funnet i HTTP Link-headere:</div>
    <pre id="headerOutput">Ingen data hentet enda...</pre>

    <div class="section-title">2. Metadata funnet i HTML &lt;head&gt; &lt;link&gt;-elementer:</div>
    <pre id="htmlOutput">Ingen data hentet enda...</pre>

    <script>
        document.getElementById('harvestBtn').addEventListener('click', async () => {
            const url = document.getElementById('targetUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const headerOutput = document.getElementById('headerOutput');
            const htmlOutput = document.getElementById('htmlOutput');

            statusDiv.innerHTML = "<em>Henter data fra " + url + "...</em>";
            headerOutput.innerText = "...";
            htmlOutput.innerText = "...";

            try {
                // Utfør HTTP-forespørselen direkte (ingen proxy trengs mellom public GH Pages)
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Kunne ikke hente siden. Statuskode: ${response.status}`);
                }

                statusDiv.innerHTML = "<span style='color: green;'>✓ Siden ble hentet suksessfullt!</span>";

                // --- DEL 1: Sjekk HTTP Link-headere ---
                // Signposting lagrer ofte relasjoner direkte i nettverks-headeren
                const linkHeader = response.headers.get('Link');
                if (linkHeader) {
                    headerOutput.innerText = parseLinkHeader(linkHeader);
                } else {
                    headerOutput.innerText = "Ingen 'Link'-header ble funnet i HTTP-responsen.";
                }

                // --- DEL 2: Sjekk HTML-innholdet ---
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Finn alle <link>-elementer som har en "rel"-attributt
                const linkElements = doc.querySelectorAll('head link[rel]');
                const htmlLinks = [];

                linkElements.forEach(link => {
                    htmlLinks.push({
                        rel: link.getAttribute('rel'),
                        href: link.getAttribute('href'),
                        type: link.getAttribute('type') || 'Ikke oppgitt'
                    });
                });

                if (htmlLinks.length > 0) {
                    htmlOutput.innerText = JSON.stringify(htmlLinks, null, 2);
                } else {
                    htmlOutput.innerText = "Fant ingen <link>-elementer med rel-attributt i HTML-headen.";
                }

            } catch (error) {
                statusDiv.innerHTML = `<span class="error">Feil: ${error.message}</span>`;
                headerOutput.innerText = "Klarte ikke å hente data.";
                htmlOutput.innerText = "Klarte ikke å hente data.";
            }
        });

        // Hjelpefunksjon for å parse komplekse HTTP Link-headere (RFC 8288) til JSON
        function parseLinkHeader(headerString) {
            const parts = headerString.split(',');
            const links = [];

            parts.forEach(part => {
                const section = part.split(';');
                if (section.length < 2) return;

                // Ekstraher URL-en mellom < og >
                const urlMatch = section[0].trim().match(/<([^>]+)>/);
                if (!urlMatch) return;
                const href = urlMatch[1];

                const linkObj = { href: href };

                // Ekstraher attributter som rel og type
                for (let i = 1; i < section.length; i++) {
                    const attrib = section[i].trim().split('=');
                    if (attrib.length === 2) {
                        const key = attrib[0].trim();
                        const val = attrib[1].trim().replace(/"/g, ''); // Fjern gåseøyne
                        linkObj[key] = val;
                    }
                }
                links.push(linkObj);
            });

            return JSON.stringify(links, null, 2);
        }
    </script>
</body>
</html>
